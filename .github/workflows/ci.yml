name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    name: Requirements / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check dependency manifests
        run: python -m pytest tests/test_dependency_manifests.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      AZURE_OPENAI_API_KEY: dummy
      AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com/
      AZURE_OPENAI_MODEL_NAME: gpt-4o
      AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: dummy
      AZURE_OPENAI_API_VERSION: 2024-12-01-preview
      AZURE_AI_SERVICE_API_KEY: dummy
      AZURE_AI_SERVICE_ENDPOINT: https://example.cognitiveservices.azure.com/

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry black==26.3.1 ruff==0.15.12

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run lint
        run: ruff check src tests

      - name: Check formatting
        run: black --check src tests

      - name: Run tests
        run: poetry run pytest -m "not api_key_required"
