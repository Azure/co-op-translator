[tool.poetry]
name = "co_op_translator"
version = "0.20.1"
description = "Easily automate the translation of your documentation into multiple languages to reach a global audience."
authors = [
    "Minseok Song <minseok.song@mssong.com>",
    "timothychungd <timothychungd@gmail.com>"
]
maintainers = [
    "Minseok Song <minseok.song@mssong.com>",
    "timothychungd <timothychungd@gmail.com>"
]
repository = "https://github.com/Azure/co-op-translator"
license = "MIT"
readme = "README.md"
keywords = ["translator", "translation","azure", "openai", "gpt"]
packages = [{ include = "co_op_translator", from = "src" }]
include = ["src/co_op_translator/fonts/*", "src/co_op_translator/templates/**/*"]
documentation = "https://azure.github.io/co-op-translator/"

[tool.poetry.scripts]
translate = "co_op_translator.__main__:main"
evaluate = "co_op_translator.__main__:main"
migrate-links = "co_op_translator.__main__:main"
co-op-review = "co_op_translator.__main__:main"
co-op-translator-mcp = "co_op_translator.mcp.server:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
agent-framework-core = "^1.16.0"
agent-framework-openai = "^1.14.1"
ai-healthcheck = "^0.1.2"
arabic-reshaper = "^3.0.1"
azure-ai-vision-imageanalysis = "^1.0.0"
azure-core = "^1.41.0"
click = "^8.5.0"
markdown-it-py = "^4.2.0"
matplotlib = ">=3.10,<4"
# Semantic Kernel 1.x requires the MCP 1.x API.
mcp = ">=1.28.1,<2"
# NumPy 2.5 requires Python 3.12; keep the newest compatible line on Python 3.11.
numpy = [
    { version = ">=2.4,<2.5", python = "3.11" },
    { version = ">=2.5,<3", python = ">=3.12,<3.15" },
]
# Microsoft Agent Framework's OpenAI provider currently requires OpenAI 2.x.
openai = ">=2.25,<3"
opencv-python = ">=5.0,<6"
pillow = "^12.3.0"
# Semantic Kernel 1.44 supports Pydantic releases below 2.14.
pydantic = ">=2.13,<2.14"
python-bidi = "^0.6.11"
python-dotenv = "^1.2.3"
pyyaml = "^6.0.3"
rich = ">=15,<16"
semantic-kernel = "^1.44.1"
tiktoken = "^0.14.0"
az-ai-healthcheck = { version = "^0.1.7", extras = ["vision"] }

[tool.poetry.group.dev.dependencies]
agent-framework-anthropic = { version = "1.0.0b260827", allow-prereleases = true }
agent-framework-ollama = { version = "1.0.0b260813", allow-prereleases = true }
black = "^26.5.1"
coverage = "^7.16.0"
freezegun = "^1.5.5"
mypy = "^2.3.1"
packaging = "^26.3"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
ruff = "^0.16.5"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "integration"]
console_output_style = "progress"
filterwarnings = ["ignore::DeprecationWarning", "ignore::ResourceWarning"]
log_cli = true
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = ["async_test", "api_key_required"]

[tool.coverage.run]
command_line = """
    -m pytest --ignore=tests/integration
    --cov --cov-report=term --cov-report=html
    --instafail -ra -n auto -m "not api_key_required"
"""
source = ["src/co_op_translator"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
sort = "Stmts"
skip_empty = true
show_missing = false
ignore_errors = true

[tool.coverage.html]
directory = "coverage"

[tool.ruff]
exclude = []
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
plugins = ["pydantic.mypy"]
follow_imports = "skip"
disable_error_code = ["type-var"]
namespace_packages = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
